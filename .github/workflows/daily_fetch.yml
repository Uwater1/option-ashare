name: Chinese Options Download

on:
  schedule:
    # Run at 16:30 Beijing Time (CST, UTC+8) is 08:30 UTC
    - cron: '30 8 * * 1-5' 
  
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write
  actions: read

jobs:
  download-options:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            index.py
            requirements.txt
            option_data

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system yfinance numpy akshare

      - name: Run options download script
        id: download
        run: |
          # Run script and capture output to a log file
          python index.py > /tmp/work_log.txt 2>&1
          
          # Print to console for real-time debugging
          cat /tmp/work_log.txt

      - name: Write work summary
        run: |
          echo "Options Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "Run completed on $(date +'%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '---' >> $GITHUB_STEP_SUMMARY 
          cat /tmp/work_log.txt >> $GITHUB_STEP_SUMMARY
          echo '---' >> $GITHUB_STEP_SUMMARY 

      - name: Commit and push options data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add option_data/ 
          
          # Only commit if there are actually changes
          git diff --staged --quiet || (git commit -m "Add options data for $(date +'%Y-%m-%d')" && git push)
